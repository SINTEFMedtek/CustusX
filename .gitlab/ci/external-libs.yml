# Builds all external C++ libraries and publishes them to the Package Registry,
# one package per library (CustusX#50).
#
# Each library's package version key is a hash of just that library's own
# resolved class (and its base classes, e.g. shared CppComponent helpers) in
# cxComponents.py, via cxLibVersionHash.py -- not the whole file. Editing one
# library's pinned version only invalidates that library's own cached
# package, not every other library's, and a library whose config doesn't
# differ between the --igstk and non---igstk variants (most of them -- only
# VTK/ITK actually differ) naturally hashes the same either way, so its
# package is shared across variants instead of built twice.
#
# Trigger conditions:
#   - Automatically when install/cx/build/cxComponents.py changes
#   - Manually from the GitLab CI/CD UI at any time
#
# The build-ubuntu* jobs in build.yml download these packages instead of
# rebuilding from source. If no package is found for a given library, they
# fall back to building just that library from source and upload the result
# so the next run can reuse it.

# Shared script steps: computes IGSTK variant flags and defines
# compute_lib_package_vars(), a shell function setting LIB_VERSION/LIB_FILE/
# LIB_URL for one library name. Referenced by both .build-and-publish-libs
# (this file) and .reuse-build (build.yml) so the upload and download sides
# can never silently drift apart on how a URL is built.
.lib-package-vars:
  script:
    - |
      if [ "${BUILD_IGSTK}" = "true" ]; then
        IGSTK_LIBS="eigen VTK ITK IGSTK OpenCV OpenIGTLink CTK OpenIGTLinkIO OpenCLUtilityLibrary QHttpServer"
        IGSTK_FLAG="--igstk"
      else
        IGSTK_LIBS="eigen VTK ITK OpenCV OpenIGTLink CTK OpenIGTLinkIO OpenCLUtilityLibrary QHttpServer"
        IGSTK_FLAG=""
        rm -rf $BASE_DIR/IGSTK
      fi
      IMAGE_TAG=$(echo $CI_JOB_IMAGE | sed 's|.*/||' | tr ':' '_')
      compute_lib_package_vars() {
        LIB="$1"
        LIB_HASH=$(python3 install/cx/build/cxLibVersionHash.py "$LIB" $IGSTK_FLAG)
        # Library name leads the version string (not just the filename) so
        # cleanup-old-external-libs' "group by everything but the trailing
        # -HASH" rotation logic keeps each library's own history separate,
        # instead of treating unrelated libraries sharing an OS/image as the
        # same rotation group.
        # IGSTK_VARIANT must be part of the key: several libraries here (CTK,
        # ITK, OpenCV, OpenIGTLinkIO) embed an *absolute path* to a sibling
        # library's own $BASE_DIR-specific build directory in their exported
        # CMake config (e.g. CTKConfig.cmake's baked-in VTK_DIR). The plain
        # and -igstk builds of the same OS use different $BASE_DIR values but
        # otherwise hash identically, so without this a tarball built under
        # one $BASE_DIR would get extracted under the other and leave stale,
        # wrong absolute paths behind -- CMake then fails to configure with
        # "Some (but not all) targets in this export set were already
        # defined," since it loads two different VTK-targets.cmake files.
        IGSTK_VARIANT="plain"
        if [ "${BUILD_IGSTK}" = "true" ]; then
          IGSTK_VARIANT="igstk"
        fi
        LIB_VERSION="${LIB}-${OS}-${IGSTK_VARIANT}-${IMAGE_TAG}-${LIB_HASH}"
        # IGSTK_VARIANT must also be in the local temp filename, not just
        # LIB_VERSION: without it, plain and -igstk jobs for the same
        # OS/library both stage their tarball at the same /tmp path, so a
        # plain-variant download/upload could clobber or be clobbered by an
        # -igstk one on a runner where both happen to overlap.
        LIB_FILE="cx-external-lib-${LIB}-${OS}-${IGSTK_VARIANT}.tar.gz"
        LIB_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/custusx-external-lib/${LIB_VERSION}/${LIB_FILE}"
      }

.build-and-publish-libs:
  stage: build-libs
  variables:
    OS: OS
    BASE_DIR: /builds/$OS
    GIT_CLONE_PATH: /builds/$OS/CX/CX
    BUILD_IGSTK: "false"
  script:
    - !reference [.lib-package-vars, script]
    - |
      MISSING_LIBS=""
      for LIB in $IGSTK_LIBS; do
        compute_lib_package_vars "$LIB"
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" "$LIB_URL")
        if [ "$HTTP_CODE" = "200" ]; then
          echo "  $LIB: package $LIB_VERSION already in registry."
        else
          echo "  $LIB: package $LIB_VERSION not found (HTTP $HTTP_CODE), needs building."
          MISSING_LIBS="$MISSING_LIBS $LIB"
        fi
      done
      echo "Missing libraries:$MISSING_LIBS"
      if [ -z "$MISSING_LIBS" ]; then
        echo "All libraries already cached, nothing to do."
        exit 0
      fi
    # Remove each about-to-be-rebuilt library's existing directory first.
    # Covers two known stale-state cases on warm/persistent runners: (1) CTK's
    # ExternalProjects (DCMTK etc.) losing their .git dir from a prior tarball
    # extraction, which breaks DCMTK's git-update step; (2) a build_Release
    # left over from before LIB_VERSION included IGSTK_VARIANT (CustusX#50),
    # when a plain-built tarball could get extracted under the -igstk
    # BASE_DIR (or vice versa), baking in the wrong absolute path and making
    # CMake refuse to reconfigure ("directory ... is different than the
    # directory ... where CMakeCache.txt was created"). Safe in general since
    # every library removed here is about to be rebuilt from source anyway.
    # Build and publish libraries one at a time -- not one combined build for
    # all of $MISSING_LIBS followed by one combined upload pass. A
    # fast-to-build library (eigen) would otherwise sit unpublished for the
    # entire time a slow one (VTK) is still compiling, even though nothing
    # about the upload actually depends on that wait. Publishing each library
    # the moment it finishes lets downstream consumers -- CX's own next run,
    # and CS/FX/FraxinusExcelsior's per-library lookups -- start reusing it
    # immediately instead of only after the whole batch completes.
    - |
      for LIB in $MISSING_LIBS; do
        # Remove this library's existing directory first. Covers two known
        # stale-state cases on warm/persistent runners: (1) CTK's
        # ExternalProjects (DCMTK etc.) losing their .git dir from a prior
        # tarball extraction, which breaks DCMTK's git-update step; (2) a
        # build_Release left over from before LIB_VERSION included
        # IGSTK_VARIANT (CustusX#50), when a plain-built tarball could get
        # extracted under the -igstk BASE_DIR (or vice versa), baking in the
        # wrong absolute path and making CMake refuse to reconfigure
        # ("directory ... is different than the directory ... where
        # CMakeCache.txt was created"). Safe since it's about to be rebuilt.
        rm -rf $BASE_DIR/$LIB
        eval ./install/cxInstaller.py -s --full -j 4 -t Release $IGSTK_FLAG $LIB
        # Pack and publish as its own package. Exclude CMakeFiles (*.o
        # intermediates) and .git history to keep the tarball small; neither
        # is needed at configure time.
        compute_lib_package_vars "$LIB"
        ( cd $BASE_DIR && tar -czf /tmp/$LIB_FILE \
          --exclude='*/CMakeFiles' \
          --exclude='*/.git' \
          $LIB )
        echo "Packed $LIB: $(du -sh /tmp/$LIB_FILE | cut -f1)"
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file /tmp/$LIB_FILE "$LIB_URL"
        echo "Published $LIB_VERSION to Package Registry."
      done
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - changes:
        - install/cx/build/cxComponents.py
    - when: manual
      allow_failure: true

build-external-libs-ubuntu20:
  extends: .build-and-publish-libs
  image: $IMAGE_UBUNTU2004
  variables:
    OS: Ubuntu2004

build-external-libs-ubuntu20-igstk:
  extends: .build-and-publish-libs
  image: $IMAGE_UBUNTU2004
  variables:
    OS: Ubuntu2004
    BUILD_IGSTK: "true"
    # BASE_DIR must match build-ubuntu20's BASE_DIR, see .gitlab-ci.yml.
    BASE_DIR: $BASE_DIR_UBUNTU2004_IGSTK
    GIT_CLONE_PATH: $BASE_DIR_UBUNTU2004_IGSTK/CX/CX

build-external-libs-ubuntu22:
  extends: .build-and-publish-libs
  image: $IMAGE_UBUNTU2204
  variables:
    OS: Ubuntu2204

build-external-libs-ubuntu22-igstk:
  extends: .build-and-publish-libs
  image: $IMAGE_UBUNTU2204
  variables:
    OS: Ubuntu2204
    BUILD_IGSTK: "true"
    # BASE_DIR must match build-ubuntu22's BASE_DIR, see .gitlab-ci.yml.
    BASE_DIR: $BASE_DIR_UBUNTU2204_IGSTK
    GIT_CLONE_PATH: $BASE_DIR_UBUNTU2204_IGSTK/CX/CX

build-external-libs-ubuntu24:
  extends: .build-and-publish-libs
  image: $IMAGE_UBUNTU2404
  variables:
    OS: Ubuntu2404

# Keeps only the KEEP_VERSIONS newest packages per library/OS/variant group in
# the custusx-external-lib registry. Run on a schedule (e.g. weekly) to
# prevent unbounded accumulation. Also available as a manual job.
cleanup-old-external-libs:
  stage: build-libs
  image: $IMAGE_UBUNTU2404
  variables:
    KEEP_VERSIONS: "1"
  script:
    - |
      python3 << 'PYEOF'
      import json, os, sys
      import urllib.request, urllib.error
      from collections import defaultdict

      api   = os.environ['CI_API_V4_URL']
      proj  = os.environ['CI_PROJECT_ID']
      token = os.environ['CI_JOB_TOKEN']
      keep  = int(os.environ.get('KEEP_VERSIONS', '1'))
      pkg_name = 'custusx-external-lib'

      def sanitize_image_tag(image):
          # Mirrors .lib-package-vars' `sed 's|.*/||' | tr ':' '_'`.
          return image.rsplit('/', 1)[-1].replace(':', '_')

      # IMAGE_UBUNTU2004/2204/2404 are pipeline-level variables (.gitlab-ci.yml),
      # so they're available here unchanged even though this job never builds.
      valid_image_tags = {
          sanitize_image_tag(os.environ['IMAGE_UBUNTU2004']),
          sanitize_image_tag(os.environ['IMAGE_UBUNTU2204']),
          sanitize_image_tag(os.environ['IMAGE_UBUNTU2404']),
      }

      def is_current_format(prefix):
          '''
          A prefix (LIB_VERSION without its trailing -HASH) can only ever be
          produced again by a live job if it ends with one of today's Docker
          image tags, and -- right before that -- an IGSTK_VARIANT segment
          ("plain" or "igstk"). A prefix that doesn't match -- an old image
          tag left behind by a Docker image bump, or an older key format like
          the pre-CustusX#50-variant-split one that omitted IGSTK_VARIANT
          entirely (seen on eigen's very first per-library package, created
          hours before the variant split) -- can never be matched by a live
          job again, so its whole group is deleted below regardless of the
          normal keep-N rotation, which only prevents an *active* prefix from
          growing unbounded and has no way to notice an *abandoned* one (it
          would otherwise sit there forever as its own permanently-kept
          group of 1).
          '''
          for tag in valid_image_tags:
              suffix = '-' + tag
              if prefix.endswith(suffix) and prefix[:-len(suffix)].endswith(('-plain', '-igstk')):
                  return True
          return False

      def api_request(path, method='GET'):
          req = urllib.request.Request(
              f'{api}/projects/{proj}/{path}',
              headers={'JOB-TOKEN': token},
              method=method)
          with urllib.request.urlopen(req) as r:
              body = r.read()
              return json.loads(body) if body else None

      packages, page = [], 1
      while True:
          batch = api_request(f'packages?package_name={pkg_name}&per_page=100&page={page}')
          if not batch:
              break
          packages.extend(batch)
          if len(batch) < 100:
              break
          page += 1
      print(f'Found {len(packages)} package(s) named "{pkg_name}"')

      # Group by library/OS/image prefix (everything except the trailing
      # -HASH) -- the library name leads the version string precisely so
      # this keeps each library's own rotation separate from every other
      # library sharing the same OS/image.
      groups = defaultdict(list)
      for p in packages:
          prefix = p['version'].rsplit('-', 1)[0]
          groups[prefix].append(p)

      deleted = 0
      for prefix, pkgs in sorted(groups.items()):
          pkgs.sort(key=lambda p: p['created_at'], reverse=True)
          if is_current_format(prefix):
              kept = [p['version'] for p in pkgs[:keep]]
              print(f'{prefix}: keeping {kept}')
              to_remove = pkgs[keep:]
          else:
              print(f'{prefix}: stale format/image tag, deleting all {len(pkgs)} version(s)')
              to_remove = pkgs
          for old in to_remove:
              try:
                  api_request(f'packages/{old["id"]}', method='DELETE')
                  print(f'  Deleted {old["version"]} (id={old["id"]})')
                  deleted += 1
              except urllib.error.HTTPError as e:
                  print(f'  WARNING: failed to delete {old["version"]}: {e}', file=sys.stderr)

      print(f'Done. Deleted {deleted} old package(s).')
      PYEOF
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: manual
      allow_failure: true
