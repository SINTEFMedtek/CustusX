# Deploy stage jobs

.deploy:
  stage: deploy
  environment: production
  variables:
    VERSION: ${CI_COMMIT_SHORT_SHA}
    GIT_CLONE_PATH: /builds/Ubuntu2004/CX/CX
  script:
    - echo "Deploying application..."
    - |
      for OS in Ubuntu2004 Ubuntu2204 Ubuntu2404; do
        cd $CI_PROJECT_DIR/$OS/package_artefacts
        INSTALLER_FILE=$(find CustusX*.tar.gz)
        curl \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file $INSTALLER_FILE \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/CustusX/$VERSION/CustusX-${OS}.tar.gz"
      done

deploy-commit:
  extends: .deploy
  variables:
    VERSION: ${CI_COMMIT_SHORT_SHA}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH # Only run for changes to the default (develop) branch
      when: never
    - if: '$CI_COMMIT_TAG == null' # Run for all commits, except tags
      when: never # Don't deploy for develop branch either

deploy-tag:
  extends: .deploy
  variables:
    VERSION: ${CI_COMMIT_TAG}
  rules:
    - if: '$CI_COMMIT_TAG != null' # Run if a tag is present (= release or release candidate)

create-release:
  stage: deploy
  image: alpine:latest
  needs: ["deploy-tag"]
  rules:
    - if: '$CI_COMMIT_TAG != null'
  script:
    - apk add --no-cache curl jq
    - |
      set -e
      # Release-notes files are committed per release cycle (e.g. v26.08), not per
      # rc tag -- strip a trailing -rcN so v26.08-rc1, v26.08-rc2, ... and the final
      # v26.08 tag all resolve to the same doc/release_notes/release_notes_v26.08.md file.
      BASE_VERSION=$(echo "$CI_COMMIT_TAG" | sed -E 's/-rc[0-9]+$//')
      NOTES_MD="doc/release_notes/release_notes_${BASE_VERSION}.md"
      if [ ! -f "$NOTES_MD" ]; then
        echo "WARNING: $NOTES_MD not found for tag ${CI_COMMIT_TAG}. Skipping release creation."
        exit 0
      fi

      LINKS=$(jq -n --arg base "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/CustusX/${CI_COMMIT_TAG}" \
        '[
          {name: "CustusX Ubuntu 20.04 installer", url: ($base + "/CustusX-Ubuntu2004.tar.gz"), link_type: "package"},
          {name: "CustusX Ubuntu 22.04 installer", url: ($base + "/CustusX-Ubuntu2204.tar.gz"), link_type: "package"},
          {name: "CustusX Ubuntu 24.04 installer", url: ($base + "/CustusX-Ubuntu2404.tar.gz"), link_type: "package"}
        ]')

      DESCRIPTION=$(jq -Rs . < "$NOTES_MD")

      curl --fail --request POST --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --header "Content-Type: application/json" \
        --data "$(jq -n --arg tag "$CI_COMMIT_TAG" --argjson links "$LINKS" --argjson desc "$DESCRIPTION" \
          '{tag_name: $tag, name: $tag, description: $desc, assets: {links: $links}}')" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"

pages:
  stage: deploy
  environment: production
  variables:
    OS: Ubuntu2004
    GIT_CLONE_PATH: /builds/$OS/CX/CX
  script:
    - '[ -d $OS/package_artefacts/html_pure/ ] || exit 0'
    - mkdir -p public
    - mv $OS/package_artefacts/html_pure/ public/user_doc/
    - mv $OS/package_artefacts/html_dev/ public/developer_doc/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # Run for all changes to the default (develop) branch only
