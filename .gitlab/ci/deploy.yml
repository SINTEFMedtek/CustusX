# Deploy stage jobs

.deploy:
  stage: deploy
  environment: production
  variables:
    VERSION: ${CI_COMMIT_SHORT_SHA}
    GIT_CLONE_PATH: /builds/Ubuntu2004/CX/CX
  script:
    - echo "Deploying application..."
    - |
      for OS in Ubuntu2004 Ubuntu2204 Ubuntu2404; do
        cd $CI_PROJECT_DIR/$OS/package_artefacts
        INSTALLER_FILE=$(find CustusX*.tar.gz)
        curl \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file $INSTALLER_FILE \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/CustusX/$VERSION/$OS/$INSTALLER_FILE"
      done

deploy-commit:
  extends: .deploy
  variables:
    VERSION: ${CI_COMMIT_SHORT_SHA}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH # Only run for changes to the default (develop) branch
      when: never
    - if: '$CI_COMMIT_TAG == null' # Run for all commits, except tags
      when: never # Don't deploy for develop branch either

deploy-tag:
  extends: .deploy
  variables:
    VERSION: ${CI_COMMIT_TAG}
  rules:
    - if: '$CI_COMMIT_TAG != null' # Run if a tag is present (= release or release candidate)

create-release:
  stage: deploy
  image: alpine:latest
  needs: ["deploy-tag"]
  rules:
    - if: '$CI_COMMIT_TAG != null'
  script:
    - apk add --no-cache curl jq
    - |
      set -e
      NOTES_MD="doc/release_notes/release_notes_${CI_COMMIT_TAG}.md"
      NOTES_HTML="doc/release_notes/release_notes_${CI_COMMIT_TAG}.html"
      if [ ! -f "$NOTES_MD" ] || [ ! -f "$NOTES_HTML" ]; then
        echo "WARNING: $NOTES_MD or $NOTES_HTML not found for tag ${CI_COMMIT_TAG}. Skipping release creation."
        exit 0
      fi

      # Upload the release notes alongside the installers already uploaded by deploy-tag
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$NOTES_HTML" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/CustusX/${CI_COMMIT_TAG}/release_notes_${CI_COMMIT_TAG}.html"

      # Discover the installer files deploy-tag already uploaded, to link them from the Release
      PACKAGE_ID=$(curl --silent --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_name=CustusX&package_version=${CI_COMMIT_TAG}" \
        | jq -r '.[0].id')

      LINKS=$(curl --silent --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/${PACKAGE_ID}/package_files" \
        | jq -c --arg base "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/CustusX/${CI_COMMIT_TAG}" \
            '[.[] | {name: .file_name, url: ($base + "/" + .file_name), link_type: "package"}]')

      DESCRIPTION=$(jq -Rs . < "$NOTES_MD")

      curl --fail --request POST --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --header "Content-Type: application/json" \
        --data "$(jq -n --arg tag "$CI_COMMIT_TAG" --argjson links "$LINKS" --argjson desc "$DESCRIPTION" \
          '{tag_name: $tag, name: $tag, description: $desc, assets: {links: $links}}')" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"

pages:
  stage: deploy
  environment: production
  variables:
    OS: Ubuntu2004
    GIT_CLONE_PATH: /builds/$OS/CX/CX
  script:
    - '[ -d $OS/package_artefacts/html_pure/ ] || exit 0'
    - mkdir -p public
    - mv $OS/package_artefacts/html_pure/ public/user_doc/
    - mv $OS/package_artefacts/html_dev/ public/developer_doc/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # Run for all changes to the default (develop) branch only
