# Build stage templates and jobs

# CI_PROJECT_DIR is deleted from the Docker image before the build,
# so a quick build requires out of source build files
.build-variables:
  variables:
    VERSION: ${CI_COMMIT_SHORT_SHA}
    OS: OS
    BASE_DIR: /builds/$OS
    GIT_CLONE_PATH: /builds/$OS/CX/CX #Changes CI_PROJECT_DIR
    BUILD_DIR: $CI_PROJECT_DIR/../build_Release
    BUILD_IGSTK: "false"

.create-installer:
  script:
    - cd $BUILD_DIR
    # Remove old installer
    - rm -f CustusX*.tar.gz
    - cpack
    # The file CustusX*.tar.gz should now be in ../build_Release, and html_pure and html_dev in ../build_Release/doc
    - cd $CI_PROJECT_DIR
    - mkdir -p $OS/package_artefacts
    - cp -R $BUILD_DIR/CustusX*.tar.gz $OS/package_artefacts/
    - cp -R $BUILD_DIR/doc/html_pure $OS/package_artefacts/html_pure/
    - cp -R $BUILD_DIR/doc/html_dev $OS/package_artefacts/html_dev/
    - echo "Compile complete."
  artifacts:
    paths:
      - $OS/package_artefacts/CustusX*.tar.gz
      - $OS/package_artefacts/html_pure/
      - $OS/package_artefacts/html_dev/

.reuse-build:
  extends:
    - .build-variables
    - .create-installer
  before_script:
  - ls $BASE_DIR
  # Manual escape hatch: set FORCE_CLEAN_APP_BUILD=true (CI/CD > Run pipeline variables)
  # to wipe this runner's incrementally-reused CustusX build tree and force a from-scratch
  # rebuild. Does not touch the external-libs cache/sentinel below. Useful when a runner's
  # persistent build tree is suspected stale (e.g. didn't pick up a downstream plugin fix).
  - |
    if [ "$FORCE_CLEAN_APP_BUILD" = "true" ]; then
      echo "FORCE_CLEAN_APP_BUILD set - wiping $BASE_DIR/CX/build_Release for a clean rebuild"
      rm -rf $BASE_DIR/CX/build_Release
    fi
  - if [ $CI_COMMIT_TAG ]; then CX_COMMIT=$CI_COMMIT_TAG; else CX_COMMIT=${CI_COMMIT_BRANCH:-$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}; fi
  - !reference [.lib-package-vars, script]
  - find $BASE_DIR/CX/build_Release -name "*igstk*" -delete 2>/dev/null || true
  # Per-library cache check (CustusX#50): each library is tried independently
  # (local sentinel first, then Package Registry), instead of one all-or-
  # nothing combined package -- an unrelated library's version bump no
  # longer forces every other library to be re-downloaded or rebuilt too.
  # All cd $BASE_DIR calls use subshells to keep the working directory at
  # CI_PROJECT_DIR.
  - |
    MISSING_LIBS=""
    for LIB in $IGSTK_LIBS; do
      compute_lib_package_vars "$LIB"
      SENTINEL="$BASE_DIR/.lib_version_${LIB}"
      if [ -f "$SENTINEL" ] && [ "$(cat "$SENTINEL")" = "$LIB_VERSION" ]; then
        echo "  $LIB: local cache hit ($LIB_VERSION)."
        continue
      fi
      echo "  $LIB: local cache miss, checking Package Registry for $LIB_VERSION..."
      HTTP_CODE=$(curl -s -o /tmp/$LIB_FILE -w "%{http_code}" \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" "$LIB_URL")
      if [ "$HTTP_CODE" = "200" ]; then
        echo "  $LIB: downloaded prebuilt package, extracting to $BASE_DIR..."
        ( cd $BASE_DIR && rm -rf $LIB && tar -xzf /tmp/$LIB_FILE )
        echo "$LIB_VERSION" > "$SENTINEL"
      else
        echo "  $LIB: package not found (HTTP $HTTP_CODE), will build from source."
        rm -f "$SENTINEL"
        MISSING_LIBS="$MISSING_LIBS $LIB"
      fi
    done
    echo "Libraries to build from source:$MISSING_LIBS"
  - |
    if [ -n "$MISSING_LIBS" ]; then
      echo "Building missing external libs from source:$MISSING_LIBS"
      # Remove each about-to-be-rebuilt library's existing directory first.
      # Covers two known stale-state cases on warm/persistent runners: (1) CTK's
      # ExternalProjects (DCMTK etc.) losing their .git dir from a prior tarball
      # extraction, which breaks DCMTK's git-update step; (2) a build_Release
      # left over from before LIB_VERSION included IGSTK_VARIANT (CustusX#50),
      # when a plain-built tarball could get extracted under the -igstk
      # BASE_DIR (or vice versa), baking in the wrong absolute path and making
      # CMake refuse to reconfigure ("directory ... is different than the
      # directory ... where CMakeCache.txt was created"). Safe in general since
      # every library removed here is about to be rebuilt from source anyway.
      for LIB in $MISSING_LIBS; do
        rm -rf $BASE_DIR/$LIB
      done
      eval ./install/cxInstaller.py -s --full -j 4 -t Release $IGSTK_FLAG \
        --main_branch $CX_COMMIT \
        --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx \
        $MISSING_LIBS
      echo "Uploading newly-built libs to Package Registry for future runs..."
      for LIB in $MISSING_LIBS; do
        compute_lib_package_vars "$LIB"
        ( cd $BASE_DIR && tar -czf /tmp/$LIB_FILE \
          --exclude='*/CMakeFiles' \
          --exclude='*/.git' \
          $LIB )
        curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file /tmp/$LIB_FILE "$LIB_URL" || true
        echo "$LIB_VERSION" > "$BASE_DIR/.lib_version_${LIB}"
      done
    fi
  - |
    echo "Building CustusX..."
    eval ./install/cxInstaller.py -s --full -j 15 -t Release --user_doc --developer_doc $IGSTK_FLAG \
      --main_branch $CX_COMMIT \
      --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx \
      components CustusX

# Shared by all three platform build jobs below so only one builds at a time
# (they'd otherwise all be eligible to run concurrently, since they're in the
# same stage and don't depend on each other) -- reduces concurrent runner load
# without needing a separate stage per platform. Which platform goes first is
# not guaranteed, just that they never overlap.
.serialize-platform-build:
  resource_group: cx-platform-build

build-ubuntu20:
  extends:
    - .reuse-build
    - .serialize-platform-build
  stage: build
  image: $IMAGE_UBUNTU2004
  variables:
    OS: Ubuntu2004
    BUILD_IGSTK: "true"
    # BASE_DIR must match build-external-libs-ubuntu20-igstk's BASE_DIR: VTK/ITK's
    # generated CMake config files embed absolute paths and are not relocatable.
    BASE_DIR: $BASE_DIR_UBUNTU2004_IGSTK
    GIT_CLONE_PATH: $BASE_DIR_UBUNTU2004_IGSTK/CX/CX

build-ubuntu22:
  extends:
    - .reuse-build
    - .serialize-platform-build
  stage: build
  image: $IMAGE_UBUNTU2204
  variables:
    OS: Ubuntu2204
    BUILD_IGSTK: "true"
    # BASE_DIR must match build-external-libs-ubuntu22-igstk's BASE_DIR: VTK/ITK's
    # generated CMake config files embed absolute paths and are not relocatable.
    BASE_DIR: $BASE_DIR_UBUNTU2204_IGSTK
    GIT_CLONE_PATH: $BASE_DIR_UBUNTU2204_IGSTK/CX/CX

build-ubuntu24:
  extends:
    - .reuse-build
    - .serialize-platform-build
  stage: build
  image: $IMAGE_UBUNTU2404
  variables:
    OS: Ubuntu2404
