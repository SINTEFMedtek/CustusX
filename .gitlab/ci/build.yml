# Build stage templates and jobs

# CI_PROJECT_DIR is deleted from the Docker image before the build,
# so a quick build requires out of source build files
.build-variables:
  # stage is set per-platform job below, to serialize platform builds.
  variables:
    VERSION: ${CI_COMMIT_SHORT_SHA}
    OS: OS
    BASE_DIR: /builds/$OS
    GIT_CLONE_PATH: /builds/$OS/CX/CX #Changes CI_PROJECT_DIR
    BUILD_DIR: $CI_PROJECT_DIR/../build_Release
    BUILD_IGSTK: "false"

.create-installer:
  script:
    - cd $BUILD_DIR
    # Remove old installer
    - rm -f CustusX*.tar.gz
    - cpack
    # The file CustusX*.tar.gz should now be in ../build_Release, and html_pure and html_dev in ../build_Release/doc
    - cd $CI_PROJECT_DIR
    - mkdir -p $OS/package_artefacts
    - cp -R $BUILD_DIR/CustusX*.tar.gz $OS/package_artefacts/
    - cp -R $BUILD_DIR/doc/html_pure $OS/package_artefacts/html_pure/
    - cp -R $BUILD_DIR/doc/html_dev $OS/package_artefacts/html_dev/
    - echo "Compile complete."
  artifacts:
    paths:
      - $OS/package_artefacts/CustusX*.tar.gz
      - $OS/package_artefacts/html_pure/
      - $OS/package_artefacts/html_dev/

.reuse-build:
  extends:
    - .build-variables
    - .create-installer
  before_script:
  - ls $BASE_DIR
  # Manual escape hatch: set FORCE_CLEAN_APP_BUILD=true (CI/CD > Run pipeline variables)
  # to wipe this runner's incrementally-reused CustusX build tree and force a from-scratch
  # rebuild. Does not touch the external-libs cache/sentinel below. Useful when a runner's
  # persistent build tree is suspected stale (e.g. didn't pick up a downstream plugin fix).
  - |
    if [ "$FORCE_CLEAN_APP_BUILD" = "true" ]; then
      echo "FORCE_CLEAN_APP_BUILD set - wiping $BASE_DIR/CX/build_Release for a clean rebuild"
      rm -rf $BASE_DIR/CX/build_Release
    fi
  - if [ $CI_COMMIT_TAG ]; then CX_COMMIT=$CI_COMMIT_TAG; else CX_COMMIT=${CI_COMMIT_BRANCH:-$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}; fi
  - !reference [.lib-package-vars, script]
  - find $BASE_DIR/CX/build_Release -name "*igstk*" -delete 2>/dev/null || true
  - LIBS_SENTINEL="$BASE_DIR/.lib_version_${PACKAGE_VERSION}"
  - echo "Libs package version $PACKAGE_VERSION"
  # Try to use prebuilt libs: local cache first, then Package Registry, then full rebuild.
  # All cd $BASE_DIR calls use subshells to keep the working directory at CI_PROJECT_DIR.
  - |
    LIBS_READY=false
    if [ -f "$LIBS_SENTINEL" ]; then
      echo "Lib cache hit: $LIBS_SENTINEL"
      LIBS_READY=true
    else
      echo "Lib cache miss, checking Package Registry..."
      HTTP_CODE=$(curl -s -o /tmp/$PACKAGE_FILE -w "%{http_code}" \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" "$PACKAGE_URL")
      if [ "$HTTP_CODE" = "200" ]; then
        echo "Downloaded prebuilt libs, extracting to $BASE_DIR..."
        ( cd $BASE_DIR && rm -rf $IGSTK_LIBS && tar -xzf /tmp/$PACKAGE_FILE )
        rm -f $BASE_DIR/.lib_version_*
        touch "$LIBS_SENTINEL"
        LIBS_READY=true
      else
        echo "Package not found (HTTP $HTTP_CODE), will build all from scratch."
      fi
    fi
  - |
    if [ "$LIBS_READY" = "true" ]; then
      echo "Building CustusX only..."
      eval ./install/cxInstaller.py -s --full -j 15 -t Release --user_doc --developer_doc $IGSTK_FLAG \
        --main_branch $CX_COMMIT \
        --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx \
        components CustusX
    else
      echo "Full build (all external libs + CustusX)..."
      # Remove stale CTK build dir — a prior tarball extraction strips .git dirs,
      # which breaks DCMTK's git-update step on warm runners.
      rm -rf $BASE_DIR/CTK
      eval ./install/cxInstaller.py -s --all --full -j 4 -t Release --user_doc --developer_doc $IGSTK_FLAG \
        --main_branch $CX_COMMIT \
        --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx
      echo "Uploading libs to Package Registry for future runs..."
      ( cd $BASE_DIR && tar -czf /tmp/$PACKAGE_FILE \
        --exclude='*/CMakeFiles' \
        --exclude='*/.git' \
        $IGSTK_LIBS )
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file /tmp/$PACKAGE_FILE "$PACKAGE_URL" || true
      rm -f $BASE_DIR/.lib_version_*
      touch "$LIBS_SENTINEL"
    fi

build-ubuntu20:
  extends: .reuse-build
  stage: build-20
  image: $IMAGE_UBUNTU2004
  variables:
    OS: Ubuntu2004
    BUILD_IGSTK: "true"
    # BASE_DIR must match build-external-libs-ubuntu20-igstk's BASE_DIR: VTK/ITK's
    # generated CMake config files embed absolute paths and are not relocatable.
    BASE_DIR: $BASE_DIR_UBUNTU2004_IGSTK
    GIT_CLONE_PATH: $BASE_DIR_UBUNTU2004_IGSTK/CX/CX

build-ubuntu22:
  extends: .reuse-build
  stage: build-22
  image: $IMAGE_UBUNTU2204
  variables:
    OS: Ubuntu2204
    BUILD_IGSTK: "true"
    # BASE_DIR must match build-external-libs-ubuntu22-igstk's BASE_DIR: VTK/ITK's
    # generated CMake config files embed absolute paths and are not relocatable.
    BASE_DIR: $BASE_DIR_UBUNTU2204_IGSTK
    GIT_CLONE_PATH: $BASE_DIR_UBUNTU2204_IGSTK/CX/CX

build-ubuntu24:
  extends: .reuse-build
  stage: build-24
  image: $IMAGE_UBUNTU2404
  variables:
    OS: Ubuntu2404
