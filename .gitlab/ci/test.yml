# Test stage templates and jobs

.test-job:   # This job runs the Unit + Integration tests
  stage: test    # It only starts when the job in the build stage completes successfully.
  variables:
    OS: OS
    GIT_CLONE_PATH: /builds/$OS/CX/CX
  script:
    - echo "Running unit tests... "
    - mkdir -p package_artefacts
    - cp -R $OS/package_artefacts/CustusX*.tar.gz package_artefacts/
    # Use commit tag if existing, otherwise use branch
    - if [ $CI_COMMIT_TAG ]; then CX_COMMIT=$CI_COMMIT_TAG; else CX_COMMIT=$CI_COMMIT_BRANCH; fi
    # Ensure test data is present (new Docker images do not include pre-built data)
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx/CustusXData.git $CI_PROJECT_DIR/data || git -C $CI_PROJECT_DIR/data fetch --all
    - git -C $CI_PROJECT_DIR/data reset --hard origin/HEAD
    - xvfb-run ./install/cxJenkinsMasterBuild.py --test_package --main_branch $CX_COMMIT --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx
  artifacts:
    when: always
    name: ${CI_JOB_NAME}-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA}
    paths:
      - test_results/*junit.xml
    reports:
      junit: test_results/*junit.xml

test-ubuntu20:
  extends: .test-job
  needs: ["build-ubuntu20"]
  image: $IMAGE_UBUNTU2004
  variables:
    OS: Ubuntu2004

test-ubuntu22:
  extends: .test-job
  needs: ["build-ubuntu22"]
  image: $IMAGE_UBUNTU2204
  variables:
    OS: Ubuntu2204

test-ubuntu24:
  extends: .test-job
  needs: ["build-ubuntu24"]
  image: $IMAGE_UBUNTU2404
  variables:
    OS: Ubuntu2404
