# CustusX GitLab CI/CD configuration file

default:
  #image: olevs/custusx-build-ubuntu2004 #Prebuilt CustusX, Dockerhub
  #image: olevs/custusx-ubuntu2004 #Empty image, with only environment
  #image: gitlab.sintef.no:5050/custusx/custusx/custusx-ubuntu2004 # Slower build if not reusing the build from last run
  image: gitlab.sintef.no:5050/custusx/custusx/custusx-build-ubuntu2004:25.02.01

stages:          # List of stages for jobs, and their order of execution
  - build
  - test
  - deploy

# Cleanup old builds from runners
# Can be removed after a while
cleanup-old-builds:
  stage: .pre
  script:
  - cd $CI_PROJECT_DIR
  - cd ..
  - rm -rf build_Release
  - cd ..
  - ls
  - rm -rf CTK
  - rm -rf IGSTK
  - rm -rf OpenCLUtilityLibrary
  - rm -rf OpenCV
  - rm -rf OpenIGTLink
  - rm -rf OpenIGTLinkIO
  - rm -rf QHttpServer
  - rm -rf VTK
  - rm -rf ITK
  - rm -rf eigen
  - rm -rf medtekAI
  - rm -rf ISB_DataStreaming
  - rm -rf CX
  - rm -rf CS
  - rm -rf FX
  - rm -rf Installed
  - rm -rf temp

.build-job:       # This job runs in the build stage, which runs first.
  stage: build
  variables:
    VERSION: ${CI_COMMIT_SHORT_SHA}
    OS: OS
    SOURCE_DIR: $CI_PROJECT_DIR/$OS/CX/CX
  script:
    # - export # For listing all gitlab variables
    - echo "Compiling the code..."
    - cd $CI_PROJECT_DIR
    - echo $OS
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx/CustusX.git $SOURCE_DIR
    - cd $SOURCE_DIR
    - git checkout $CI_COMMIT_BRANCH
    - ./install/cxJenkinsMasterBuild.py --create_package --developer_doc --main_branch $CI_COMMIT_BRANCH --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx
    - echo "Compile complete."
  artifacts:
    paths:
    # CI_PROJECT_DIR="/builds/custusx/CustusX"
      - $SOURCE_DIR/package_artefacts/CustusX*.tar.gz
      - $SOURCE_DIR/package_artefacts/html_pure/
      - $SOURCE_DIR/package_artefacts/html_dev/
    #expire_in: never # Default is 30 days. May need to set releases to "never"?

# It looks like CI_PROJECT_DIR is deleted from the Docker image before the build,
# so a quick build will require out of source build files
.quick-build-job:
  stage: build
  variables:
    VERSION: ${CI_COMMIT_SHORT_SHA}
    OS: OS
    SOURCE_DIR: $CI_PROJECT_DIR/../../$OS/CX/CX
    BUILD_DIR: $CI_PROJECT_DIR/../../$OS/CX/build_Release
  script:
    # - export # For listing all gitlab variables
    - echo "Compiling the code..."
    - ls $CI_PROJECT_DIR/../..
    - ls $CI_PROJECT_DIR/../../$OS
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx/CustusX.git $SOURCE_DIR
    - cd $SOURCE_DIR
    - ls
    - ls ..
    - ls ../..
    - git checkout $CI_COMMIT_BRANCH
    - ./install/cxInstaller.py -s --full -t Release --user_doc --developer_doc --main_branch $CI_COMMIT_BRANCH --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx components CustusX
    # Create installer
    - cd $BUILD_DIR
    # Remove old installer
    - rm CustusX*.tar.gz
    - cpack
    # The file CustusX*.tar.gz schould now be in ../build_Release, and html_pure and html_dev in ../build_Release/doc
    - echo "Compile complete."
  artifacts:
    paths:
      - $BUILD_DIR/CustusX*.tar.gz
      - $BUILD_DIR/doc/html_pure/
      - $BUILD_DIR/doc/html_dev/

build-ubuntu20:
  extends: .build-job
  image: gitlab.sintef.no:5050/custusx/custusx/custusx-build-ubuntu2004:25.02.02
  variables:
    OS: Ubuntu2004

build-ubuntu22:
  extends: .build-job
  image: gitlab.sintef.no:5050/custusx/custusx/custusx-build-ubuntu2204:25.02.02
  variables:
    OS: Ubuntu2204

quick-build-ubuntu20:
  extends: .quick-build-job
  image: gitlab.sintef.no:5050/custusx/custusx/custusx-build-ubuntu2004:25.02.02
  variables:
    OS: Ubuntu2004

.test-job:   # This job runs the Unit + Integration tests
  stage: test    # It only starts when the job in the build stage completes successfully.
  variables:
    OS: OS
    SOURCE_DIR: $CI_PROJECT_DIR/$OS/CX/CX
  script:
    - echo "Running unit tests... "
    - cd $CI_PROJECT_DIR
    - rm -rf $SOURCE_DIR
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx/CustusX.git $SOURCE_DIR
    - cd $SOURCE_DIR
    - git checkout $CI_COMMIT_BRANCH
    - xvfb-run ./install/cxJenkinsMasterBuild.py --test_package --main_branch $CI_COMMIT_BRANCH --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx
  artifacts:
    when: always
    name: ${CI_JOB_NAME}-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA}
    paths:
      - $SOURCE_DIR/test_results/*junit.xml
    reports:
      junit: $SOURCE_DIR/test_results/*junit.xml

test-ubuntu20:
  extends: .test-job
  image: gitlab.sintef.no:5050/custusx/custusx/custusx-build-ubuntu2004:25.02.02
  variables:
    OS: Ubuntu2004

test-ubuntu22:
  extends: .test-job
  image: gitlab.sintef.no:5050/custusx/custusx/custusx-build-ubuntu2204:25.02.02
  variables:
    OS: Ubuntu2204

quick-test-ubuntu20:
  extends: .test-job
  image: gitlab.sintef.no:5050/custusx/custusx/custusx-build-ubuntu2004:25.02.02
  variables:
    OS: Ubuntu2004
    SOURCE_DIR: $CI_PROJECT_DIR/../../$OS/CX/CX

.deploy:
  stage: deploy
  environment: production
  variables:
    VERSION: ${CI_COMMIT_SHORT_SHA}
  script:
  - echo "Deploying application..."
  - cd $CI_PROJECT_DIR/Ubuntu2004/CX/CX/package_artefacts
  - INSTALLER_FILE=$(find CustusX*.tar.gz)
  - 'curl
     --header "JOB-TOKEN: $CI_JOB_TOKEN"
     --upload-file $INSTALLER_FILE
     "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/CustusS/$VERSION/Ubuntu2004/$INSTALLER_FILE"'
  - cd $CI_PROJECT_DIR/Ubuntu2204/CX/CX/package_artefacts
  - INSTALLER_FILE=$(find CustusX*.tar.gz)
  - 'curl
     --header "JOB-TOKEN: $CI_JOB_TOKEN"
     --upload-file $INSTALLER_FILE
     "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/CustusS/$VERSION/Ubuntu2204/$INSTALLER_FILE"'

deploy-commmit:
  extends: .deploy
  variables:
    VERSION: ${CI_COMMIT_SHORT_SHA}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH # Only run for changes to the default (develop) branch
      # when: never
    - if: '$CI_COMMIT_TAG == null' # Run for all commits, except tags

deploy-tag:
  extends: .deploy
  variables:
    VERSION: ${CI_COMMIT_TAG}
  rules:
    - if: '$CI_COMMIT_TAG != null' # Run if a tag is present (= release or release candidate)

pages:
  stage: deploy
  environment: production
  variables:
    OS: Ubuntu2004
    SOURCE_DIR: $CI_PROJECT_DIR/$OS/CX/CX
  script:
    - cd $SOURCE_DIR
    - mv package_artefacts/html_pure/ public/user_doc/
    - mv package_artefacts/html_dev/ public/developer_doc/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # Run for all changes to the default (develop) branch only
