# This file is a template, and might need editing before it works on your project.
# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages
#
# You can copy and paste this template into a new `.gitlab-ci.yml` file.
# You should not add this template to an existing `.gitlab-ci.yml` file by using the `include:` keyword.
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

default:
  #image: olevs/custusx-build-ubuntu2004 #Prebuilt CustusX, Dockerhub
  #image: olevs/custusx-ubuntu2004 #Empty image, with only environment
  image: gitlab.sintef.no:5050/custusx/custusx/custusx-build-ubuntu2004

stages:          # List of stages for jobs, and their order of execution
  - build
  - test
  - deploy

build-job:       # This job runs in the build stage, which runs first.
  stage: build
  script:
    # - export # For listing all gitlab variables
    - echo "Compiling the code..."
    - cd $CI_PROJECT_DIR
    - ./install/cxJenkinsMasterBuild.py --coverage --create_package --developer_doc --main_branch $CI_COMMIT_BRANCH --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx
    - echo "Compile complete."
  artifacts:
    paths:
    # CI_PROJECT_DIR="/builds/custusx/CustusX"
      - package_artefacts/CustusX*.tar.gz
      - package_artefacts/doc/html_pure/

test-job:   # This job runs the Unit + Integration tests
  stage: test    # It only starts when the job in the build stage completes successfully.
  script:
    - echo "Running unit tests... "
    - xvfb-run ./install/cxJenkinsMasterBuild.py --test_package --main_branch $CI_COMMIT_BRANCH --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx
    - gcovr --xml-pretty --exclude-unreachable-branches --print-summary -o ${CI_PROJECT_DIR}/test_results/coverage.xml --root $CI_PROJECT_DIR/../build_Release
  coverage: /^\s*lines:\s*\d+.\d+\%/
  artifacts:
    when: always
    name: ${CI_JOB_NAME}-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA}
    paths:
      - test_results/*junit.xml
    reports:
      junit: test_results/*junit.xml
      coverage_report:
        coverage_format: cobertura
        path: ${CI_PROJECT_DIR}/test_results/coverage.xml

#lint-test-job:   # This job also runs in the test stage.
#  stage: test    # It can run at the same time as unit-test-job (in parallel).
#  script:
#    - echo "Linting code... This will take about 10 seconds."
#   - #sleep 10
#    - echo "No lint issues found."

deploy-job:      # This job runs in the deploy stage.
  stage: deploy  # It only runs when *both* jobs in the test stage complete successfully.
  environment: production
  script:
    - echo "Deploying application..."
    - cd $CI_PROJECT_DIR/package_artefacts
    - INSTALLER_FILE=$(find CustusX*.tar.gz)
    - 'curl
           --header "JOB-TOKEN: $CI_JOB_TOKEN"
           --upload-file $INSTALLER_FILE
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/CustusX/${CI_COMMIT_SHORT_SHA}/$INSTALLER_FILE"'
    # version number (23.10) can be replaced with ${CI_COMMIT_TAG} if a git tag is present

