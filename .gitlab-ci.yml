# CustusX GitLab CI/CD configuration file

default:
  #image: gitlab.sintef.no:5050/custusx/custusx/custusx-ubuntu2004 # Slower build if not reusing the build from last run
  image: gitlab.sintef.no:5050/custusx/custusx/custusx-build-ubuntu2004:25.02.01

stages:          # List of stages for jobs, and their order of execution
  - build
  - test
  - deploy

# Cleanup old builds from runners
# Can be removed after a while
.cleanup-old-builds:
  stage: .pre
  script:
  - pwd
  - cd ..
  - ls
  - rm -rf build_Release
  - cd ..
  - ls
  - rm -rf CTK
  - rm -rf IGSTK
  - rm -rf OpenCLUtilityLibrary
  - rm -rf OpenCV
  - rm -rf OpenIGTLink
  - rm -rf OpenIGTLinkIO
  - rm -rf QHttpServer
  - rm -rf VTK
  - rm -rf ITK
  - rm -rf eigen
  - rm -rf medtekAI
  - rm -rf ISB_DataStreaming
  - rm -rf CX
  - rm -rf CS
  - rm -rf FX
  - rm -rf Installed
  - rm -rf temp

# CI_PROJECT_DIR is deleted from the Docker image before the build,
# so a quick build requires out of source build files
.build-variables:
  stage: build
  variables:
    VERSION: ${CI_COMMIT_SHORT_SHA}
    OS: OS
    BASE_DIR: /builds/$OS
    GIT_CLONE_PATH: /builds/$OS/CX/CX #Changes CI_PROJECT_DIR
    BUILD_DIR: $CI_PROJECT_DIR/../build_Release

.create-installer:
  script:
    - cd $BUILD_DIR
    # Remove old installer
    - rm -f CustusX*.tar.gz
    - cpack
    # The file CustusX*.tar.gz should now be in ../build_Release, and html_pure and html_dev in ../build_Release/doc
    - cd $CI_PROJECT_DIR
    - mkdir -p $OS/package_artefacts
    - cp -R $BUILD_DIR/CustusX*.tar.gz $OS/package_artefacts/
    - cp -R $BUILD_DIR/doc/html_pure $OS/package_artefacts/html_pure/
    - cp -R $BUILD_DIR/doc/html_dev $OS/package_artefacts/html_dev/
    - echo "Compile complete."
  artifacts:
    paths:
      - $OS/package_artefacts/CustusX*.tar.gz
      - $OS/package_artefacts/html_pure/
      - $OS/package_artefacts/html_dev/

.reuse-build:
  extends: 
    - .build-variables
    - .create-installer
  before_script:
  - echo "Run cxInstaller.py"
  - ls $BASE_DIR
  # Use commit tag if exsiting, otherwise use branch
  - if [ $CI_COMMIT_TAG ]; then CX_COMMIT=$CI_COMMIT_TAG; else CX_COMMIT=$CI_COMMIT_BRANCH; fi
  - rm -rf $BASE_DIR/CTK # Make sure we got a fresh CTK after changing the library
  # Reuse previous library build folders if existing, just checking VTK build folder
  - test -d $BASE_DIR/VTK/build_Release
      && eval ./install/cxInstaller.py -s --full -t Release --user_doc --developer_doc --main_branch $CX_COMMIT --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx
      components CustusX CTK
      || eval ./install/cxInstaller.py -s --all --full -t Release --user_doc --developer_doc --main_branch $CX_COMMIT --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx

build-ubuntu20:
  extends: .reuse-build
  image: gitlab.sintef.no:5050/custusx/custusx/custusx-build-ubuntu2004:26.04.02
  variables:
    OS: Ubuntu2004

build-ubuntu22:
  extends: .reuse-build
  image: gitlab.sintef.no:5050/custusx/custusx/custusx-build-ubuntu2204:26.04.02
  variables:
    OS: Ubuntu2204

.test-job:   # This job runs the Unit + Integration tests
  stage: test    # It only starts when the job in the build stage completes successfully.
  variables:
    OS: OS
    GIT_CLONE_PATH: /builds/$OS/CX/CX
  script:
    - echo "Running unit tests... "
    - mkdir -p package_artefacts
    - cp -R $OS/package_artefacts/CustusX*.tar.gz package_artefacts/
    # Use commit tag if exsiting, otherwise use branch
    - if [ $CI_COMMIT_TAG ]; then CX_COMMIT=$CI_COMMIT_TAG; else CX_COMMIT=$CI_COMMIT_BRANCH; fi
    - xvfb-run ./install/cxJenkinsMasterBuild.py --test_package --main_branch $CX_COMMIT --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx
  artifacts:
    when: always
    name: ${CI_JOB_NAME}-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA}
    paths:
      - test_results/*junit.xml
    reports:
      junit: test_results/*junit.xml

test-ubuntu20:
  extends: .test-job
  needs: ["build-ubuntu20"]
  image: gitlab.sintef.no:5050/custusx/custusx/custusx-build-ubuntu2004:26.04.02
  variables:
    OS: Ubuntu2004

test-ubuntu22:
  extends: .test-job
  needs: ["build-ubuntu22"]
  image: gitlab.sintef.no:5050/custusx/custusx/custusx-build-ubuntu2204:26.04.02
  variables:
    OS: Ubuntu2204

.deploy:
  stage: deploy
  environment: production
  variables:
    VERSION: ${CI_COMMIT_SHORT_SHA}
    OS: Ubuntu2004
    GIT_CLONE_PATH: /builds/$OS/CX/CX
  script:
  - echo "Deploying application..."
  - cd $CI_PROJECT_DIR/Ubuntu2004/package_artefacts
  - INSTALLER_FILE=$(find CustusX*.tar.gz)
  - 'curl
     --header "JOB-TOKEN: $CI_JOB_TOKEN"
     --upload-file $INSTALLER_FILE
     "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/CustusX/$VERSION/Ubuntu2004/$INSTALLER_FILE"'
  - cd $CI_PROJECT_DIR/Ubuntu2204/package_artefacts
  - INSTALLER_FILE=$(find CustusX*.tar.gz)
  - 'curl
     --header "JOB-TOKEN: $CI_JOB_TOKEN"
     --upload-file $INSTALLER_FILE
     "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/CustusX/$VERSION/Ubuntu2204/$INSTALLER_FILE"'

deploy-commmit:
  extends: .deploy
  variables:
    VERSION: ${CI_COMMIT_SHORT_SHA}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH # Only run for changes to the default (develop) branch
      when: never
    - if: '$CI_COMMIT_TAG == null' # Run for all commits, except tags
      when: never # Don't deploy for develop branch either

deploy-tag:
  extends: .deploy
  variables:
    VERSION: ${CI_COMMIT_TAG}
  rules:
    - if: '$CI_COMMIT_TAG != null' # Run if a tag is present (= release or release candidate)

pages:
  stage: deploy
  environment: production
  variables:
    OS: Ubuntu2004
    GIT_CLONE_PATH: /builds/$OS/CX/CX
  script:
    - mv $OS/package_artefacts/html_pure/ public/user_doc/
    - mv $OS/package_artefacts/html_dev/ public/developer_doc/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # Run for all changes to the default (develop) branch only
