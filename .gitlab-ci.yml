# CustusX GitLab CI/CD configuration file

workflow:
  rules:
    # Run automatically for merge requests, the "Run pipeline" button, tags, and
    # direct pushes to develop/master. A plain push to any other branch (e.g. a
    # feature or release branch accumulating commits before tagging) creates no
    # pipeline on its own -- use "Run pipeline" (CI/CD > Pipelines) to test one
    # before opening an MR or tagging, instead of every push triggering a full
    # build across all platforms.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "master"
    - when: never

default:
  image: gitlab.sintef.no:5050/custusx/custusx/custusx-build-ubuntu2004:26.04.02
  # Let a newer pipeline on the same branch/MR cancel this one's still-running
  # jobs instead of letting superseded work finish (requires "Auto-cancel
  # redundant, pending pipelines" enabled in Settings > CI/CD > General
  # pipelines). Deploy-stage jobs override this back to false -- a tag/release
  # upload must never be cut off mid-way.
  interruptible: true

stages:
  - test-python
  - build-libs
  # The three platform build jobs share a resource_group (see build.yml) so only
  # one builds at a time, reducing concurrent runner load without needing a
  # separate stage per platform.
  - build
  - test
  - deploy

variables:
  IMAGE_UBUNTU2004: "gitlab.sintef.no:5050/custusx/custusx/custusx-build-ubuntu2004:26.04.02"
  IMAGE_UBUNTU2204: "gitlab.sintef.no:5050/custusx/custusx/custusx-build-ubuntu2204:26.04.02"
  IMAGE_UBUNTU2404: "gitlab.sintef.no:5050/custusx/custusx/custusx-build-ubuntu2404:26.04.02"
  # Shared between build.yml and external-libs.yml: VTK/ITK's generated CMake
  # config files embed absolute paths and are not relocatable, so the IGSTK-enabled
  # build and its matching external-libs build must use the exact same BASE_DIR.
  BASE_DIR_UBUNTU2004_IGSTK: "/builds/Ubuntu2004igstk"
  BASE_DIR_UBUNTU2204_IGSTK: "/builds/Ubuntu2204igstk"

include:
  - local: '.gitlab/ci/test-python.yml'
  - local: '.gitlab/ci/external-libs.yml'
  - local: '.gitlab/ci/build.yml'
  - local: '.gitlab/ci/test.yml'
  - local: '.gitlab/ci/deploy.yml'
